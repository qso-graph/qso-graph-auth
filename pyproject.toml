[project]
name = "qso-graph-auth"
version = "0.1.0"
description = "Persona and credential management for qso-graph MCP servers"
license = {text = "GPL-3.0-or-later"}
requires-python = ">=3.11"
authors = [{name = "KI7MT", email = "ki7mt@proton.me"}]
readme = "README.md"
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Ham Radio",
    "Intended Audience :: End Users/Desktop",
]
dependencies = [
    "keyring>=24.0",
]

[project.scripts]
qso-auth = "qso_graph_auth.cli:main"

[project.urls]
Homepage = "https://qso-graph.io"
Repository = "https://github.com/qso-graph/qso-graph-auth"
Issues = "https://github.com/qso-graph/qso-graph-auth/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
