name: Publish to PyPI

# The release flow (qso-graph/.github TEMPLATES.md): work lands on `develop`; a release is a
# PR from `develop` into `main`, and merging it publishes. `main` is always the released code.
# qso-graph-auth is a library: PyPI only, no MCP Registry entry, no server.json.
on:
  push:
    branches: [ main ]

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  security:
    name: Security gates
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      package: ${{ steps.version.outputs.package }}
    steps:
      - uses: actions/checkout@v4

      # main changes only by a release PR, so main's version must be new. Computed once; every
      # later job uses it. The gate fails closed: anything it cannot confirm stops the release.
      - name: The version on main is new
        id: version
        run: |
          VERSION="$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)"
          PACKAGE="$(grep -m1 '^name' pyproject.toml | cut -d'"' -f2)"
          echo "${PACKAGE} ${VERSION}"
          # Only a 404 means "not published yet"; unreachable or 5xx is not a yes.
          CODE="$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/${PACKAGE}/${VERSION}/json")"
          case "$CODE" in
            404) echo "PyPI: ${PACKAGE} ${VERSION} is new" ;;
            200) echo "FAIL: ${PACKAGE} ${VERSION} is already on PyPI. main changes only by a release PR with a new version."; exit 1 ;;
            *)   echo "FAIL: PyPI returned ${CODE}; cannot confirm ${VERSION} is new"; exit 1 ;;
          esac
          # git ls-remote --exit-code: 2 means no such tag; anything else (0, 128) stops.
          set +e
          git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" > /dev/null
          RC=$?
          set -e
          case "$RC" in
            2) echo "tag v${VERSION} does not exist yet" ;;
            0) echo "FAIL: tag v${VERSION} already exists"; exit 1 ;;
            *) echo "FAIL: could not check tags (git ls-remote exited ${RC})"; exit 1 ;;
          esac
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "package=${PACKAGE}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install pytest pip-audit

      - name: Run security test suite
        run: python -m pytest tests/test_security.py -v

      - name: Audit dependencies for vulnerabilities
        # Audits this package's declared dependencies, and can fail: a known CVE stops the release.
        # A finding with no fix yet is excepted only explicitly: --ignore-vuln ID, with a reason and date.
        run: pip-audit --strict --desc on .

      - name: Grep check — no subprocess/shell
        run: |
          if grep -rn 'subprocess\.\|os\.system\|shell=True' src/; then
            echo "FAIL: subprocess/shell found in source"
            exit 1
          fi

      - name: Grep check — no plaintext http://
        run: |
          if grep -rn 'http://' src/ | grep -v 'localhost\|127\.0\.0\.1\|::1'; then
            echo "FAIL: non-HTTPS URL found in source"
            exit 1
          fi

      - name: Grep check — no credential logging
        run: |
          if grep -rn -i 'print.*password\|print.*api_key\|logging.*password\|logging.*api_key' src/; then
            echo "FAIL: credential logging found in source"
            exit 1
          fi

  publish:
    name: Build and publish to PyPI
    needs: security
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # Required for trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  # ---------------------------------------------------------------------------
  # Done when PyPI serves the version (verify); then tag the released commit. A workflow's
  # own tag push triggers nothing. If tagging fails after PyPI serves it, the
  # release IS published: re-running the job is safe.
  # ---------------------------------------------------------------------------
  verify:
    name: Verify PyPI
    needs: [security, publish]
    runs-on: ubuntu-latest
    steps:
      - name: PyPI serves the released version
        run: |
          VERSION="${{ needs.security.outputs.version }}"
          PACKAGE="${{ needs.security.outputs.package }}"
          for i in $(seq 1 40); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/${PACKAGE}/${VERSION}/json")" = "200" ]; then
              echo "PyPI serves ${PACKAGE} ${VERSION}"
              exit 0
            fi
            sleep 15
          done
          echo "FAIL: PyPI never served ${PACKAGE} ${VERSION}"
          exit 1

  tag:
    name: Tag the release
    needs: [security, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Create and push vX.Y.Z
        run: |
          VERSION="${{ needs.security.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${VERSION}" -m "${GITHUB_REPOSITORY#*/} ${VERSION}" "$GITHUB_SHA"
          git push origin "v${VERSION}"
