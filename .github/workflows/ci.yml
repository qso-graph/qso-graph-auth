name: CI

# A pull request is tested whatever it targets, and deliberately has no branch
# filter. `main` is the one long-lived branch now, so `push` names it; but a filter
# here would mean a pull request into any other branch ran no ruff, no mypy and no
# pytest while still reporting green.
on:
  pull_request:
  push:
    branches: [main]
  # Weekly, because an advisory is published against a lockfile that has not
  # changed, and no pull-request-or-push trigger fires for that.
  schedule:
    - cron: "17 6 * * 1"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Lint and types, once rather than per Python: both read the source, and
  # neither answer changes with the interpreter running them (qso-graph-devel#66).
  lint:
    name: ruff and mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install (locked)
        run: uv sync --group dev --frozen

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type-check (mypy)
        run: uv run mypy src

  test:
    name: pytest (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install (locked)
        run: uv sync --group dev --frozen

      - name: Unit tests
        run: uv run pytest tests --ignore=tests/test_security.py -v

      - name: Security tests
        run: uv run pytest tests/test_security.py -v

  # Audits the LOCKED environment, which is a different question from the one the
  # release gate asks. publish.yml runs `pip-audit --strict --desc on .` -- the
  # project's *declared* dependencies, resolved fresh -- which protects the people
  # who `pip install` this library and cannot see uv.lock at all.
  #
  # This job syncs `--frozen` and audits what that produced, so a stale lock cannot
  # sit unnoticed. On 2026-10-25 five MCP servers carried a CRITICAL certifi
  # advisory in their lockfiles that Dependabot never opened a pull request for.
  audit:
    name: audit (locked dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install (locked)
        run: uv sync --group dev --frozen

      - name: No known vulnerability in the locked dependencies
        run: uv run --with pip-audit pip-audit --strict

  ci-all-green:
    name: ci-all-green
    needs: [lint, test, audit]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Verify required jobs all succeeded
        run: |
          if [[ "${{ needs.lint.result }}" != "success" ]]; then
            echo "FAIL: ruff or mypy did not pass (result=${{ needs.lint.result }})"
            exit 1
          fi
          if [[ "${{ needs.test.result }}" != "success" ]]; then
            echo "FAIL: test matrix did not all succeed (result=${{ needs.test.result }})"
            exit 1
          fi
          if [[ "${{ needs.audit.result }}" != "success" ]]; then
            echo "FAIL: the locked dependencies have a known vulnerability (result=${{ needs.audit.result }})"
            exit 1
          fi
          echo "All required CI jobs passed."
